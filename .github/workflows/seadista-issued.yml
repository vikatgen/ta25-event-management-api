# Käivita üks kord kohe pärast repo loomist: Actions → "Seadista issued" → Run workflow.
# Loob sildid, verstapostid ja issued 1–48 + ülevaate (49) failidest .github/seadistus/issued/.
name: Seadista issued

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  seadista:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node .github/seadistus/seadista-issued.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
